<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Poll</title>

    <link rel="stylesheet" href="stylesheets/style.css">
</head>

<body>
    <div class="mainDivHomePage">
        <div class="roomCodeDiv"></div>
        <h1>Create Poll</h1>
        <h2 id="roomCodeID"></h2>

        <h2 id="questionText"></h2>
        <div class="input-group">
            <input autocomplete="off" type="text" name="Enter The Question" placeholder="Enter The Question"
                id="questionInput" class="input">
            <button type="button" id="setQuestion" onclick="SetPollQuestion()" class="button">Set Question</button>
        </div>

        <br>
        <div class="input-group">
            <h2>Options</h2>

            <div id="optionsList" class="rightAlignedGroup"></div>
            <br>

            <input autocomplete="off" type="text" name="Option Value" placeholder="Option Value" id="optionValueInput"
                class="input">
            <input type="checkbox" name="OptionCorrect" id="optionCorrectCheckbox"> <label
                for="optionCorrectCheckbox">Correct</label>
            <br>

            <button type="button" id="addOptionButton" onclick="CreateOption()" class="buttonFullSpan">Add
                Option</button>

            <h3 class="totalUsersCenter" id="totalUsers"></h3>
            <button type="button" id="startPollButton" onclick="StartPoll()" class="buttonFullSpan">Start Poll</button>
        </div>
        <br>
        <br>
    </div>
    <p class="madeByWho">Made by - realXP, 2026</p>
    <script src="scripts/app.js"></script>
    <script src="scripts/create_poll.js"></script>

</body>

</html>
